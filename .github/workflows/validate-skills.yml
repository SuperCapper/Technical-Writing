name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/validate_skills.py
      - run: python tests/test_guardrails.py
      - run: python agent-loop/tools/validate_loop.py
      - run: python agent-loop/tests/test_orchestrator.py
      - run: python agent-loop/tests/test_run_loop.py
