id: foundations.ethics-check
name: Ethical Considerations
version: 1.0.0
category: foundations
description: |
  Screens a technical document or communication plan for the ethical hazards the book identifies: undisclosed image alteration, uncredited ideas, fabricated or cherry-picked data, hidden ambiguity, and social-media-unsafe language. Flags for human judgment rather than issuing verdicts, since ethics here turns on intent, not just rule-following.
target_input: markdown
output_format: markdown
parameters:
  context_note:
    type: string
    default: ''
    description: Optional note on the situational context, since ethics is intent-relative, not just rule-based.
system_prompt: |
  You are a technical-writing ethics reviewer. Per the book's model, ethics is not reducible to a checklist
      of rules (accuracy, honesty, no plagiarism, etc.) -- those behaviors merely correlate with the real
      question, which is whether the communication is intended to do good or to deceive. You surface possible
      ethical hazards for a human to weigh; you do not pronounce final ethical verdicts. Return only the
      findings list, not a rewritten document.
user_prompt_template: |
  <task>
      Review the document below for ethical hazards a technical writer should address before publishing.
      {% if context_note %}Context: {{ context_note }}{% endif %}
      </task>

      <hazards_to_check>
      - Images or figures that appear modified without a caption disclosing the alteration and its purpose.
      - Ideas, data, quotations, or images used without attribution (plagiarism / copyright risk).
      - Claims stated as fact that are actually speculation or opinion.
      - Statistics or data presentation that could mislead (cherry-picked samples, distorted axes, loaded framing).
      - Omitted, downplayed, or obscured facts that run contrary to the document's thesis.
      - Content that would be unsafe or unprofessional if it leaked onto social media or outside its intended audience.
      - Missing disclosure where a nondisclosure agreement or confidentiality boundary may apply.
      </hazards_to_check>

      <instructions>
      - For each hazard found, quote the offending passage and explain the specific risk.
      - Do not flag stylistic issues unrelated to ethics.
      - If nothing is found, say so explicitly rather than inventing a concern.
      </instructions>

      <document>
      {{ document }}
      </document>
checklist:
- Am I being accurate, honest, and free of speculation presented as fact?
- Have I given proper credit for every non-original idea, image, or dataset (see Documentation, Ch. 16)?
- Have I avoided violating copyright, fair use, or an applicable nondisclosure agreement?
- If any image has been altered, have I disclosed the alteration and its purpose in the caption?
- Is my underlying intent to do good for my audience, not to deceive them?
- Would this content, if it became public via social media, embarrass or expose me or my organization?
examples:
- description: Flagging an undisclosed altered image
  input: 'Figure 3: Students on campus, October 2020.

    (The photo was digitally altered to remove several people to illustrate social distancing.)'
  expected_output: 'Hazard: Image alteration not disclosed in the caption itself. The caption states only
    ''Students on campus, October 2020'' -- the alteration is mentioned in surrounding prose, not in the
    figure''s title/caption where a reader skimming figures would see it. Fix: state directly in the caption,
    e.g. ''Figure 3: Students on campus, October 2020 (image digitally altered to reduce visible pedestrian
    density for illustrative purposes).'''
source:
  book: Technical Writing for Engineers and Scientists (ISE)
  chapter: 2
  chapter_title: Ethical Considerations
